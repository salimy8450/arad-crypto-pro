name: ARAD CRYPTO PRO V5.9.2 FLASH MOVE TEST

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arad-v59-flash-test
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated V5.9.2 test branch
        uses: actions/checkout@v4
        with:
          ref: test/v5.9.2-flash-move

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile bot_v5_9_flash_test.py

      - name: Run isolated V5.9.2 flash test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u bot_v5_9_flash_test.py
