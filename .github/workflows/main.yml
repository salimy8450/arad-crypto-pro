
name: ARAD CRYPTO PRO Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

  push:
    paths:
      - 'ARAD_CRYPTO_PRO_V5_5_OURBIT.py'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: arad-crypto-pro-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ARAD CRYPTO PRO V5.6
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u ARAD_CRYPTO_PRO_V5_5_OURBIT.py
