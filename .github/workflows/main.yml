name: ARAD CRYPTO PRO Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

  push:
    paths:
      - 'ARAD_CRYPTO_PRO_V5_5_OURBIT.py'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare signal history
        run: |
          if [ ! -f signal_state.json ]; then
            echo '{}' > signal_state.json
          fi

      - name: Restore signal history
        uses: actions/cache@v4
        with:
          path: signal_state.json
          key: signal-state-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            signal-state-${{ github.ref }}-

      - name: Run ARAD CRYPTO PRO V5.5
        run: python -u ARAD_CRYPTO_PRO_V5_5_OURBIT.py
