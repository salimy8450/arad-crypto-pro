name: ARAD CRYPTO PRO Scanner

on:
  workflow_dispatch:
  push:
    paths:
      - "test_mexc.py"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Test MEXC connection
        run: python test_mexc.py
