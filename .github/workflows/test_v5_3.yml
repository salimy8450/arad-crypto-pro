
name: ARAD CRYPTO PRO V5.3 TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v5-3:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V5.3 analysis engine
        run: python -u bot_v5_3.py
