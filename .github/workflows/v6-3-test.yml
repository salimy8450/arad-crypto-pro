name: ARAD CRYPTO PRO V6.3.1 TEST

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arad-crypto-pro-v63-test
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ARAD CRYPTO PRO V6.3.1 TEST
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u bot_bot_v6_3_ourbit_test.py
