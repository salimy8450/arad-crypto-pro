name: ARAD CRYPTO PRO V6.5.7 EARLY 5M TELEGRAM TEST

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: arad-crypto-pro-outcomes
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile bot_v6_5_7_quality_entry_test.py
      - name: Verify Telegram configuration
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          test -n "$BOT_TOKEN" || (echo "Missing GitHub secret: BOT_TOKEN" && exit 1)
          test -n "$CHAT_ID" || (echo "Missing GitHub secret: CHAT_ID" && exit 1)
      - name: Run V6.5.7 early 5m scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u bot_v6_5_7_quality_entry_test.py
